[package]
name = "feignhttp-generator"
version = "0.1.0"
edition = "2021"
description = "OpenAPI to feignhttp client code generator"
license = "MIT"

[workspace]
members = ["consumer-test"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
ureq = "2"

[[bin]]
name = "feignhttp-generator"
path = "src/main.rs"
