[package]
name = "consumer-test"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
feignhttp = { git = "https://github.com/LiJoeAllen/feignhttp", branch = "dev", features = ["reqwest-client", "reqwest-json", "reqwest-multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
feignhttp-generator = { path = ".." }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[package.metadata.feignhttp-generator]
spec = "https://petstore3.swagger.io/api/v3/openapi.json"
layout = "module"
out = "feign_api.rs"
generate = true
